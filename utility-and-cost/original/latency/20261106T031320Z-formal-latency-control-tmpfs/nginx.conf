worker_processes 2;
pid /var/lib/sotamem/lat-upstream/nginx.pid;
error_log /var/lib/sotamem/lat-upstream/error.log;
events { worker_connections 1024; }
http {
  default_type application/octet-stream;
  sendfile on;
  tcp_nodelay on;
  log_format lat '$msec $request_time $connection $connection_requests $ssl_session_reused $ssl_protocol $request_method $request_uri $status $request_length $bytes_sent $host';
  access_log /var/lib/sotamem/lat-upstream/access.log lat;
  ssl_protocols TLSv1.3;
  ssl_certificate /var/lib/sotamem/lat-upstream/leaf.pem;
  ssl_certificate_key /var/lib/sotamem/lat-upstream/leaf.key;
  map $http_x_api_key $key_ok { "<test value>" 1; default 0; }
  # The big block's response: nginx reads the whole request body first (a static handler would answer before reading
  # it), then passes this 1 MiB on. Both arms go through it.
  upstream big_response { server 127.0.0.1:8081; keepalive 8; }
  server { listen 127.0.0.1:8081; access_log off; root /var/lib/sotamem/lat-upstream/www; location = /big-1m { } }
  server {
    listen 10.77.0.2:443 ssl;
    server_name plain.lat.test;
    keepalive_timeout 75s; keepalive_requests 1000000; ssl_session_cache shared:s:1m;
    
    root /var/lib/sotamem/lat-upstream/www;
    location / { rewrite ^ /body-1k break; }
    location /big/ {
      client_max_body_size 2m;
      client_body_buffer_size 128k;
      rewrite ^ /big-1m break;
      proxy_pass http://big_response;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
  server {
    listen 10.77.0.2:8443 ssl;
    server_name plain.lat.test;
    keepalive_timeout 0; ssl_session_cache off; ssl_session_tickets off;
    
    root /var/lib/sotamem/lat-upstream/www;
    location / { rewrite ^ /body-1k break; }
    location /big/ {
      client_max_body_size 2m;
      client_body_buffer_size 128k;
      rewrite ^ /big-1m break;
      proxy_pass http://big_response;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
  server {
    listen 10.77.0.2:443 ssl;
    server_name cred.lat.test;
    keepalive_timeout 75s; keepalive_requests 1000000; ssl_session_cache shared:s:1m;
    if ($key_ok = 0) { return 403; }
    root /var/lib/sotamem/lat-upstream/www;
    location / { rewrite ^ /body-1k break; }
    location /big/ {
      client_max_body_size 2m;
      client_body_buffer_size 128k;
      rewrite ^ /big-1m break;
      proxy_pass http://big_response;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
  server {
    listen 10.77.0.2:8443 ssl;
    server_name cred.lat.test;
    keepalive_timeout 0; ssl_session_cache off; ssl_session_tickets off;
    if ($key_ok = 0) { return 403; }
    root /var/lib/sotamem/lat-upstream/www;
    location / { rewrite ^ /body-1k break; }
    location /big/ {
      client_max_body_size 2m;
      client_body_buffer_size 128k;
      rewrite ^ /big-1m break;
      proxy_pass http://big_response;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }
}
